<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pervasion SA | الموقع تحت الصيانة</title>
  <meta name="description" content="Pervasion SA - الموقع تحت الصيانة والتطوير">
  <link rel="icon" type="image/png" href="images/under-construction.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .maintenance-container {
      width: 100%;
      max-width: 1100px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .maintenance-img {
      max-width: 100%;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .admin-access-link {
      position: fixed;
      bottom: 16px;
      left: 16px;
      font-size: 12px;
      color: #94a3b8;
      text-decoration: none;
      background: rgba(248, 250, 252, 0.9);
      border: 1px solid #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .admin-access-link:hover {
      color: #0f172a;
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
    @media (max-width: 768px) {
      .maintenance-container {
        padding: 12px;
      }
      .admin-access-link {
        bottom: 10px;
        left: 10px;
        font-size: 11px;
        padding: 5px 10px;
      }
    }
  </style>
</head>
<body>

  <main class="maintenance-container">
    <img src="images/under-construction.png" alt="Pervasion SA - الموقع تحت الصيانة" class="maintenance-img">
  </main>

  <a href="admin/" class="admin-access-link" title="لوحة التحكم">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <span>لوحة التحكم (Admin)</span>
  </a>

</body>
</html>
