<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(15, 10)">
    <!-- Hexagonal tech shield -->
    <polygon points="30,0 60,17.3 60,52 30,69.3 0,52 0,17.3" fill="#0F172A" stroke="url(#pGrad)" stroke-width="2.5"/>
    <polygon points="30,8 52,21.5 52,47.8 30,61.3 8,47.8 8,21.5" fill="none" stroke="url(#pGrad)" stroke-width="1.2" opacity="0.6"/>
    <!-- Central P / Signal node -->
    <circle cx="30" cy="34.6" r="8" fill="url(#pGrad)"/>
    <circle cx="30" cy="34.6" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Circuit connection lines -->
    <line x1="30" y1="8" x2="30" y2="20" stroke="#10B981" stroke-width="2"/>
    <line x1="8" y1="47.8" x2="20" y2="40" stroke="#10B981" stroke-width="2"/>
    <line x1="52" y1="47.8" x2="40" y2="40" stroke="#10B981" stroke-width="2"/>
    <circle cx="30" cy="8" r="2.5" fill="#FBBF24"/>
    <circle cx="8" cy="47.8" r="2.5" fill="#FBBF24"/>
    <circle cx="52" cy="47.8" r="2.5" fill="#FBBF24"/>
  </g>

  <!-- Typography -->
  <g transform="translate(90, 36)">
    <text font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="1">
      PERVASION <tspan fill="#059669">SA</tspan>
    </text>
    <text y="22" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.5">
      بيرفيجن السعودية للحلول الرقمية والتقنية
    </text>
  </g>
</svg>