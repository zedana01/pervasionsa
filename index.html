<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction | Pervasion SA</title>
  <link rel="icon" type="image/png" href="images/under-construction.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .construction-container {
      width: 100%;
      max-width: 1129px;
      text-align: center;
      margin: auto;
    }
    .construction-container img {
      max-width: 100%;
      height: auto;
      display: inline-block;
    }
    .admin-bar-discreet {
      position: fixed;
      bottom: 15px;
      right: 15px;
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }
    .admin-bar-discreet:hover {
      opacity: 1;
    }
    .admin-btn-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .admin-btn-link:hover {
      background: #0f172a;
    }
  </style>
</head>
<body>

  <div class="construction-container">
    <img src="images/under-construction.png" alt="Under Construction" width="1129" height="491">
  </div>

  <!-- Discreet Admin Link for the owner -->
  <div class="admin-bar-discreet">
    <a href="admin/" class="admin-btn-link" title="لوحة التحكم">
      <i class="fas fa-lock"></i>
      <span>لوحة التحكم</span>
    </a>
  </div>

</body>
</html>
